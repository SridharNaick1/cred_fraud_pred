[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cred-pred"
version = "0.1.0"
description = "Credit card fraud prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost"
    ]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
